<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ogpourya.ir</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Tech bro, gym rat, music lover.">
  <meta property="og:title" content="仌 POURYA - Pourya Zaeemfar (پوریا زعیم فر)">
  <meta property="og:description" content="Tech bro, gym rat, music lover.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ogpourya.ir">
  <meta property="og:image" content="assets/img/avatar-600.jpg">
  <meta name="theme-color" content="#0f1014">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="仌 POURYA - Pourya Zaeemfar (پوریا زعیم فر)">
  <meta name="twitter:description" content="Tech bro, gym rat, music lover.">
  <meta name="twitter:image" content="assets/img/avatar-600.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #f5f5f7;
      --ink-2: #98989d;
      --ink-3: #6b6b70;
      --line: rgba(255,255,255,0.09);
      --accent: #5e9eff;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 13vh 24px 48px;
      background:
        radial-gradient(55vw 45vh at 10% -8%, rgba(94,106,255,0.16), transparent 62%),
        radial-gradient(50vw 40vh at 95% 4%, rgba(0,113,227,0.13), transparent 60%),
        radial-gradient(45vw 42vh at 55% 112%, rgba(16,185,129,0.10), transparent 60%),
        radial-gradient(38vw 36vh at -5% 85%, rgba(217,70,239,0.08), transparent 60%),
        #0f1014;
      background-attachment: fixed;
    }
    main { width: 100%; max-width: 480px; animation: rise 0.8s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }

    .avatar {
      width: 68px; height: 68px;
      border-radius: 20px;
      object-fit: cover;
      display: block;
      margin-bottom: 26px;
      padding: 2px;
      background: linear-gradient(135deg, #5e6aff, #0071e3 45%, #10b981);
      box-shadow: 0 8px 28px -6px rgba(94,106,255,0.45);
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(90deg, #7c8bff, #4da3ff 55%, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      margin-top: 8px;
      font-size: 15px;
      color: var(--ink-2);
      letter-spacing: -0.01em;
    }
    .bio {
      margin-top: 18px;
      font-size: 16px;
      line-height: 1.6;
      color: #c7c7cc;
      letter-spacing: -0.01em;
    }

    .links {
      margin-top: 38px;
      list-style: none;
      border-top: 1px solid var(--line);
    }
    .links li { border-bottom: 1px solid var(--line); }
    .row {
      --c: var(--accent);
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 16px 2px;
      background: none;
      border: none;
      font: inherit;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      text-align: left;
      letter-spacing: -0.01em;
      transition: color 0.2s, padding 0.25s cubic-bezier(0.22,1,0.36,1);
      -webkit-tap-highlight-color: transparent;
    }
    .row:hover, .row:focus-visible {
      color: var(--c);
      outline: none;
      padding-left: 8px;
    }
    .dot {
      flex-shrink: 0;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 10px var(--c);
      opacity: 0.85;
      transition: transform 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .row:hover .dot { transform: scale(1.35); }
    .row .label { font-size: 16px; font-weight: 500; flex: 1; }
    .row .right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--ink-3);
      transition: color 0.2s;
    }
    .row:hover .right { color: var(--c); }
    .row .arrow { transition: transform 0.2s ease; font-size: 13px; }
    .row:hover .arrow { transform: translate(2px, -2px); }
    .voorivex  { --c: #a78bfa; }
    .github    { --c: #e8eaed; }
    .github .dot { box-shadow: 0 0 10px rgba(232,234,237,0.5); }
    .telegram  { --c: #37bbfe; }
    .discord   { --c: #7d8cff; }
    #copyState { font-variant-numeric: tabular-nums; }

    footer {
      margin-top: 42px;
      font-size: 13px;
      color: #565659;
      letter-spacing: -0.01em;
    }

    @media (max-width: 480px) {
      body { padding-top: 8vh; }
      h1 { font-size: 29px; }
      .row { padding: 14px 2px; }
      .row:hover { padding-left: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      .row, .dot, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="assets/img/avatar-400.jpg" alt="Portrait of Pourya Zaeemfar">
    <h1>仌 POURYA</h1>
    <p class="sub">Pourya Zaeemfar (پوریا زعیم فر) · Urmia, Iran</p>
    <p class="bio">Tech bro, gym rat, music lover.</p>

    <ul class="links">
      <li>
        <a class="row voorivex" href="https://voorivex.academy/profile/ogpourya" target="_blank" rel="noopener noreferrer">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">Voorivex</span>
          <span class="right">voorivex.academy <span class="arrow">&#8599;</span></span>
        </a>
      </li>
      <li>
        <a class="row github" href="https://github.com/ogpourya" target="_blank" rel="noopener noreferrer">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">GitHub</span>
          <span class="right">ogpourya <span class="arrow">&#8599;</span></span>
        </a>
      </li>
      <li>
        <a class="row telegram" href="https://t.me/ogpourya" target="_blank" rel="noopener noreferrer">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">Telegram</span>
          <span class="right">@ogpourya <span class="arrow">&#8599;</span></span>
        </a>
      </li>
      <li>
        <button class="row discord" type="button" onclick="copyDiscord()" aria-label="Copy Discord username ogpourya">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">Discord</span>
          <span class="right"><span id="copyState">ogpourya · tap to copy</span></span>
        </button>
      </li>
    </ul>

    <footer>&copy; 2026</footer>
  </main>

  <script>
    function copyDiscord() {
      const state = document.getElementById('copyState');
      const done = () => {
        state.textContent = 'Copied \u2713';
        setTimeout(() => state.textContent = 'ogpourya \u00B7 tap to copy', 1600);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText('ogpourya').then(done, function(){});
      } else {
        const ta = document.createElement('textarea');
        ta.value = 'ogpourya'; document.body.appendChild(ta);
        ta.select();
        try { if (document.execCommand('copy')) done(); } catch(e) {}
        document.body.removeChild(ta);
      }
    }
  </script>
</body>
</html>
